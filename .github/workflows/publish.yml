name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Check if already published
        id: check
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          if curl -sf "https://repo.plasmoverse.com/releases/su/plo/slib/common/${VERSION}/common-${VERSION}.pom" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already published, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: ./gradlew publishAllPublicationsToPlasmoverseReleasesRepository -Pmodded.versions_mode=ALL --stacktrace
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Tag version
        if: steps.check.outputs.published != 'true'
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          git tag "${VERSION}"
          git push origin "${VERSION}"

  dokka:
    name: Build & Deploy Dokka docs
    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21

      - name: Restore previous doc versions
        run: |
          mkdir -p previousDocVersions
          git fetch origin gh-pages --depth=1 || exit 0
          WORK=$(mktemp -d)
          git worktree add "$WORK" origin/gh-pages

          # preserve already-archived older versions
          if [ -d "$WORK/older" ]; then
            cp -r "$WORK/older"/* previousDocVersions/ 2>/dev/null || true
          fi

          # archive the currently deployed version (skip if same as current)
          if [ -f "$WORK/version.json" ]; then
            PREV_VERSION=$(jq -r '.version' "$WORK/version.json")
            CURRENT_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
              mkdir -p "previousDocVersions/$PREV_VERSION"
              rsync -a --exclude='older/' "$WORK/" "previousDocVersions/$PREV_VERSION/"
            fi
          fi

          git worktree remove "$WORK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew dokkaGeneratePublicationHtml --stacktrace

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/html
          force_orphan: false
          cname: slib.plasmoverse.com
