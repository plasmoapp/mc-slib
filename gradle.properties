# Version
group=su.plo.slib
version=2.0.0

# Gradle args
org.gradle.jvmargs=-Xmx4G -Dkotlin.daemon.jvm.options=-Xmx512M
org.gradle.workers.max=4
kotlin.stdlib.default.dependency=false

# Modded versions to configure
# ALL - all supported versions
# DEVELOPMENT - only vcs version (1.21-fabric) and versions from modded.versions_dev
# NONE - disables modded projects
modded.versions_mode=DEVELOPMENT
modded.versions_dev=1.21.11-fabric,1.21.11-neoforge,26.1-fabric,26.1-neoforge
